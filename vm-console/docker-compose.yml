name: victoria-console

# Pinned to the v1.136 LTS line (supported for 12 months from v1.136.0).
# v1.148.0 is the newer community release if you want the latest features.
# Do not use v1.140.0, v1.136.4 or v1.122.19 — they mis-evaluate the operand
# order in binary expressions.

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest # v1.136.14
    container_name: vm-storage
    restart: unless-stopped
    ports:
      - 8428:8428 # Original
      - 8089:8089 #* Accept metrics in the InfluxDB line protocol via TCP/UDP
      - 8089:8089/udp
      - 2003:2003 #* Accept metrics in the Graphite protocol via TCP/UDP
      - 2003:2003/udp
      - 4242:4242 #* Accept data from OpenTSDB-compatible agents
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
      - -retentionPeriod=30d
      # The default 30s offset hides the most recent samples, which makes a
      # live dashboard look broken. Match it to the scrape interval instead.
      - -search.latencyOffset=10s
      - -search.maxQueryDuration=60s
      - -loggerFormat=json
      #* Addons
      - -graphiteListenAddr=:2003
      - -opentsdbListenAddr=:4242
      - -influxListenAddr=:8089
      - -vmalert.proxyURL=http://vmalert:8880
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8428/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  vmagent:
    image: victoriametrics/vmagent:latest # v1.136.14
    container_name: vm-agent
    restart: unless-stopped
    ports:
      - '8429:8429'
    volumes:
      - ./docker/scrape.yml:/etc/vmagent/scrape.yml:ro
      - vmagent-data:/vmagent-data
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/vmagent-data
      - -httpListenAddr=:8429
      - -loggerFormat=json
    depends_on:
      victoriametrics:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vm-console
    restart: unless-stopped
    ports:
      - '3000:3000'
    networks:
      - default
      - cloudflare_tunnel
    environment:
      # Container-to-container, so this is the service name — not localhost.
      # Only the console's server process ever resolves it; the browser talks
      # to the console, and the console talks to VictoriaMetrics.
      VM_URL: http://victoriametrics:8428
      VM_TIMEOUT_MS: '60000'
      # Same idea, for the read-only vmalert proxy (rule groups + active alerts).
      VMALERT_URL: http://vmalert:8880
      VMALERT_TIMEOUT_MS: '15000'
      # Where the browser reaches this app. adapter-node checks it on requests
      # that change state; change it if you publish on another host or port.
      ORIGIN: http://localhost:3000
      # Cloudflare Access JWT validation — only enforced when both are set.
      # Set in vm-console/.env or exported in shell for the cloudflare-auth profile.
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    depends_on:
      victoriametrics:
        condition: service_healthy
      vmalert:
        condition: service_started

  # --- `cloudflare-auth` console variant ------------------------------------
  # Identical to `console` but: no host port binding (only reachable through
  # vmauth-cloudflare), ORIGIN set to the public tunnel hostname so SvelteKit's
  # CSRF check passes for state-changing requests, and JWT enforcement active.
  console-cloudflare:
    profiles: ['cloudflare-auth']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vm-console-cloudflare
    restart: unless-stopped
    networks:
      - default
      - cloudflare_tunnel
    environment:
      VM_URL: http://victoriametrics:8428
      VM_TIMEOUT_MS: '60000'
      VMALERT_URL: http://vmalert:8880
      VMALERT_TIMEOUT_MS: '15000'
      # Must match the public tunnel hostname — SvelteKit validates Host against this.
      ORIGIN: https://${CLOUDFLARE_HOSTNAME:-vm.jasonkolodziej.com}
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    depends_on:
      victoriametrics:
        condition: service_healthy
      vmalert:
        condition: service_started

  # --- `basic-auth` profile ------------------------------------------------
  # Same app, reached through vmauth instead of talking to VictoriaMetrics
  # and vmalert directly. Off by default so `docker compose up` keeps working
  # exactly as before; opt in with:
  #   docker compose --profile basic-auth up -d --build
  # Runs alongside the plain `console` above (different port), not instead of
  # it — nothing about the default path changes when you turn this on. Also
  # requires uncommenting the `users:` block in docker/vmauth.yml first.
  console-auth:
    profiles: ['basic-auth']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vm-console-auth
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      VM_URL: http://vmauth:8427
      VM_BASIC_AUTH: console-vm:local-dev-vm
      VM_TIMEOUT_MS: '60000'
      VMALERT_URL: http://vmauth:8427
      VMALERT_BASIC_AUTH: console-vmalert:local-dev-vmalert
      VMALERT_TIMEOUT_MS: '15000'
      ORIGIN: http://localhost:3001
    depends_on:
      vmauth:
        condition: service_healthy

  # vmauth fronts VictoriaMetrics and vmalert behind one authenticated
  # endpoint. Only `console-auth` (the `basic-auth` profile) talks to it —
  # see docker/vmauth.yml for the routing/credentials.
  vmauth:
    profiles: ['basic-auth']
    image: victoriametrics/vmauth:latest # v1.136.14
    container_name: vm-auth
    restart: unless-stopped
    ports:
      - '8427:8427'
    volumes:
      - ./docker/vmauth.yml:/etc/vmauth/vmauth.yml:ro
    command:
      - -auth.config=/etc/vmauth/vmauth.yml
      - -httpListenAddr=:8427
      - -loggerFormat=json
    depends_on:
      victoriametrics:
        condition: service_healthy
      vmalert:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8427/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- `cloudflare-auth` profile --------------------------------------------
  # Two layers: Cloudflare Access is the *actual* gate — it authenticates the
  # user at Cloudflare's edge and blocks the request before cloudflared ever
  # proxies it inward. `vmauth-cloudflare` is a second, origin-side check on
  # top of that: it independently verifies the signature on the
  # `Cf-Access-Jwt-Assertion` JWT Access forwards, so a request that somehow
  # reached this network without going through Cloudflare's edge (a
  # misconfigured route, a compromised neighbour container) still gets
  # rejected here. Neither layer touches the plain `console`/`basic-auth`
  # services above.
  #
  #   docker compose --profile cloudflare-auth up -d --build
  #
  # One-time setup outside this repo, in the Cloudflare Zero Trust dashboard:
  #   1. Networks > Tunnels: create a tunnel, add a public hostname whose
  #      service is http://vm-auth-cloudflare:8427 — the container_name below,
  #      not the compose service name `vmauth-cloudflare`. Both should be
  #      valid Docker DNS names, but only the container_name resolved
  #      reliably from cloudflared in testing. Use http://console:3000
  #      directly instead if you'd rather skip the origin-side check and
  #      rely on Access alone.
  #   2. Access > Applications: create an application for that hostname with
  #      whatever policy/IdP you want. Cloudflare's own login works out of
  #      the box; Dex or any other IdP you've connected to Access works too.
  #      Copy its Audience (AUD) tag from the app's Overview tab.
  #   3. Copy the tunnel token from step 1, and your team domain (the <team>
  #      in <team>.cloudflareaccess.com, under Settings > Custom Pages) and
  #      the AUD tag from step 2, into CLOUDFLARE_TUNNEL_TOKEN,
  #      CLOUDFLARE_TEAM_DOMAIN and CLOUDFLARE_ACCESS_AUD — either exported
  #      in your shell or added to vm-console/.env, which compose reads for
  #      interpolation too, separately from how the app reads its own env.
  #   4. Fetch the current signing keys once so vmauth-cloudflare has
  #      something to check against — the `cloudflare-jwt-keys` service below
  #      does this automatically on startup, but Cloudflare rotates keys
  #      roughly every 6 weeks, so re-run it periodically:
  #        docker compose run --rm cloudflare-jwt-keys
  cloudflared:
    profiles: ['cloudflare-auth']
    image: cloudflare/cloudflared:latest
    container_name: vm-cloudflared
    restart: unless-stopped
    command: tunnel run
    networks:
      - cloudflare_tunnel
    extra_hosts: #? https://community.cloudflare.com/t/browser-ssh-connection-using-cloudflared-docker-image-not-working/449037/10
      - "host.docker.internal:host-gateway" #? https://docs.docker.com/desktop/features/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
      - "host.containers.internal:host-gateway" #? https://developers.redhat.com/articles/2021/09/14/podman-tips-tricks#access-host-services
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      # A plain ${VAR:?...} required-variable here would fail interpolation
      # for the *whole* compose file, including plain `docker compose up`
      # with no profile — compose resolves all services' variables up front,
      # before filtering by profile. Defaulting to empty and letting
      # cloudflared itself refuse to start on a blank token is the only way
      # to keep this profile truly opt-in.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      vmauth-cloudflare:
        condition: service_healthy

  # One-shot: fetches Cloudflare Access's current JWT signing certs and
  # writes vmauth-cloudflare's `jwt.public_keys` config from them, via
  # docker/fetch-cloudflare-certs.sh. Exits after writing the file; re-run it
  # (see step 4 above) to pick up rotated keys.
  cloudflare-jwt-keys:
    profiles: ['cloudflare-auth']
    image: alpine:3.20
    container_name: vm-cloudflare-jwt-keys
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'sh /fetch-certs.sh'
    environment:
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    volumes:
      - ./docker/fetch-cloudflare-certs.sh:/fetch-certs.sh:ro
      - vmauth-cloudflare-config:/out

  # The origin-side JWT check described above. Only cloudflared talks to it —
  # see docker/fetch-cloudflare-certs.sh for how its config is produced.
  # NOTE: the plain `console` service still exposes :3000 on the host. If you
  # want to fully enforce Cloudflare Access, block :3000 at the host firewall
  # so the only inbound path is cloudflared → vmauth-cloudflare → console.
  vmauth-cloudflare:
    profiles: ['cloudflare-auth']
    image: victoriametrics/vmauth:latest # v1.136.14
    container_name: vm-auth-cloudflare
    restart: unless-stopped
    ports:
      - '8437:8427'
    volumes:
      - vmauth-cloudflare-config:/etc/vmauth:ro
    networks:
      - cloudflare_tunnel
    command:
      - -auth.config=/etc/vmauth/vmauth-cloudflare.yml
      - -httpListenAddr=:8427
      # Read the token from Cloudflare's header instead of the default
      # `Authorization` — the reason this can't share the `basic-auth`
      # profile's vmauth instance, which reads Authorization for Basic Auth.
      # No -httpAuthHeader: vmauth JWT auth always requires Authorization: Bearer,
      # which cloudflared doesn't set. Auth is enforced by cloudflared (required JWT)
      # and Cloudflare Access at the edge; vmauth acts as a routing proxy here.
      - -loggerFormat=json
    depends_on:
      cloudflare-jwt-keys:
        condition: service_completed_successfully
      console-cloudflare:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8427/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # vmalert executes alerting and recording rules
  vmalert:
    image: victoriametrics/vmalert:latest # v1.148.0
    depends_on:
      - "victoriametrics"
      - "alertmanager"
    ports:
      - 8880:8880
    volumes:
      - ./docker/alerts/rules/alerts-single-node.yml:/etc/alerts/alerts-single-node.yml
      - ./docker/alerts/rules/alerts-health.yml:/etc/alerts/alerts-health.yml
      - ./docker/alerts/rules/alerts-vmagent.yml:/etc/alerts/alerts-vmagent.yml
      - ./docker/alerts/rules/alerts-vmalert.yml:/etc/alerts/alerts-vmalert.yml
      - ./docker/alerts/rules/alerts-vmbackupmanager.yml:/etc/alerts/alerts-vmbackupmanager.yml
    command:
      - "--datasource.url=http://victoriametrics:8428/"
      - "--remoteRead.url=http://victoriametrics:8428/"
      - "--remoteWrite.url=http://vmagent:8429/"
      - "--notifier.url=http://alertmanager:9093/"
      - "--rule=/etc/alerts/*.yml"
      # display source of alerts in grafana
      - "--external.url=http://127.0.0.1:3000" #grafana outside container
      - '--external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}'
    restart: always

  # node_exporter exposes host-level OS/hardware metrics (CPU, memory, disk, network).
  # Mounted read-only so the container never writes to the host.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: vm-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # alertmanager receives alerting notifications from vmalert
  # and distributes them according to --config.file.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./docker/alerts/alertmanager.yml:/config/alertmanager.yml
    command:
      - "--config.file=/config/alertmanager.yml"
    ports:
      - 9093:9093
    restart: always
volumes:
  vm-data:
  vmagent-data:
  vmauth-cloudflare-config:

networks:
  cloudflare_tunnel:
    attachable: true
    name: cloudflare_tunnel
