name: victoria-console

# Pinned to the v1.136 LTS line (supported for 12 months from v1.136.0).
# v1.148.0 is the newer community release if you want the latest features.
# Do not use v1.140.0, v1.136.4 or v1.122.19 — they mis-evaluate the operand
# order in binary expressions.

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest # v1.136.14
    container_name: vm-storage
    restart: unless-stopped
    ports:
      - 8428:8428 # Original
      - 8089:8089 #* Accept metrics in the InfluxDB line protocol via TCP/UDP
      - 8089:8089/udp
      - 2003:2003 #* Accept metrics in the Graphite protocol via TCP/UDP
      - 2003:2003/udp
      - 4242:4242 #* Accept data from OpenTSDB-compatible agents
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
      - -retentionPeriod=30d
      # The default 30s offset hides the most recent samples, which makes a
      # live dashboard look broken. Match it to the scrape interval instead.
      - -search.latencyOffset=10s
      - -search.maxQueryDuration=60s
      - -loggerFormat=json
      #* Addons
      - -graphiteListenAddr=:2003
      - -opentsdbListenAddr=:4242
      - -influxListenAddr=:8089
      - -vmalert.proxyURL=http://vmalert:8880
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8428/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  vmagent:
    image: victoriametrics/vmagent:latest # v1.136.14
    container_name: vm-agent
    restart: unless-stopped
    ports:
      - '8429:8429'
    volumes:
      - ./docker/scrape.yml:/etc/vmagent/scrape.yml:ro
      - vmagent-data:/vmagent-data
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/vmagent-data
      - -httpListenAddr=:8429
      - -loggerFormat=json
    depends_on:
      victoriametrics:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vm-console
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Container-to-container, so this is the service name — not localhost.
      # Only the console's server process ever resolves it; the browser talks
      # to the console, and the console talks to VictoriaMetrics.
      VM_URL: http://victoriametrics:8428
      VM_TIMEOUT_MS: '60000'
      # Same idea, for the read-only vmalert proxy (rule groups + active alerts).
      VMALERT_URL: http://vmalert:8880
      VMALERT_TIMEOUT_MS: '15000'
      # Where the browser reaches this app. adapter-node checks it on requests
      # that change state; change it if you publish on another host or port.
      ORIGIN: http://localhost:3000
    depends_on:
      victoriametrics:
        condition: service_healthy
      vmalert:
        condition: service_started

  # --- `auth` profile ----------------------------------------------------
  # Same app, reached through vmauth instead of talking to VictoriaMetrics
  # and vmalert directly. Off by default so `docker compose up` keeps working
  # exactly as before; opt in with:
  #   docker compose --profile auth up -d --build
  # Runs alongside the plain `console` above (different port), not instead of
  # it — nothing about the default path changes when you turn this on.
  console-auth:
    profiles: ['auth']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vm-console-auth
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      VM_URL: http://vmauth:8427
      VM_BASIC_AUTH: console-vm:local-dev-vm
      VM_TIMEOUT_MS: '60000'
      VMALERT_URL: http://vmauth:8427
      VMALERT_BASIC_AUTH: console-vmalert:local-dev-vmalert
      VMALERT_TIMEOUT_MS: '15000'
      ORIGIN: http://localhost:3001
    depends_on:
      vmauth:
        condition: service_healthy

  # vmauth fronts VictoriaMetrics and vmalert behind one authenticated
  # endpoint. Only `console-auth` (the `auth` profile) talks to it — see
  # docker/vmauth.yml for the routing/credentials.
  vmauth:
    profiles: ['auth']
    image: victoriametrics/vmauth:latest # v1.136.14
    container_name: vm-auth
    restart: unless-stopped
    ports:
      - '8427:8427'
    volumes:
      - ./docker/vmauth.yml:/etc/vmauth/vmauth.yml:ro
    command:
      - -auth.config=/etc/vmauth/vmauth.yml
      - -httpListenAddr=:8427
      - -loggerFormat=json
    depends_on:
      victoriametrics:
        condition: service_healthy
      vmalert:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8427/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # vmalert executes alerting and recording rules
  vmalert:
    image: victoriametrics/vmalert:latest # v1.148.0
    depends_on:
      - "victoriametrics"
      - "alertmanager"
    ports:
      - 8880:8880
    volumes:
      - ./docker/alerts/rules/alerts-single-node.yml:/etc/alerts/alerts-single-node.yml
      - ./docker/alerts/rules/alerts-health.yml:/etc/alerts/alerts-health.yml
      - ./docker/alerts/rules/alerts-vmagent.yml:/etc/alerts/alerts-vmagent.yml
      - ./docker/alerts/rules/alerts-vmalert.yml:/etc/alerts/alerts-vmalert.yml
      - ./docker/alerts/rules/alerts-vmbackupmanager.yml:/etc/alerts/alerts-vmbackupmanager.yml
    command:
      - "--datasource.url=http://victoriametrics:8428/"
      - "--remoteRead.url=http://victoriametrics:8428/"
      - "--remoteWrite.url=http://vmagent:8429/"
      - "--notifier.url=http://alertmanager:9093/"
      - "--rule=/etc/alerts/*.yml"
      # display source of alerts in grafana
      - "--external.url=http://127.0.0.1:3000" #grafana outside container
      - '--external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}'
    restart: always

  # node_exporter exposes host-level OS/hardware metrics (CPU, memory, disk, network).
  # Mounted read-only so the container never writes to the host.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: vm-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # alertmanager receives alerting notifications from vmalert
  # and distributes them according to --config.file.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./docker/alerts/alertmanager.yml:/config/alertmanager.yml
    command:
      - "--config.file=/config/alertmanager.yml"
    ports:
      - 9093:9093
    restart: always
volumes:
  vm-data:
  vmagent-data:
